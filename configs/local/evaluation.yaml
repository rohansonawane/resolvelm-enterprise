seed: 42
profile: apple_silicon_mps
test_path: data/processed/incidents_test.jsonl
artifacts_dir: artifacts
docs_dir: docs
predictions_dir: artifacts/predictions
max_samples: 24
timeout_s: 20
smoke: true

backends:
