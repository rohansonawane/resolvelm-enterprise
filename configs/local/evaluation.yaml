    kind: rule
    name: rule_baseline
  sft:
    kind: auto
    name: sft
    adapter_path: outputs/sft
    classifier_path: outputs/sft/classifier.joblib
  dpo:
    kind: auto
    name: dpo
    adapter_path: outputs/dpo
    classifier_path: outputs/dpo/classifier.joblib
