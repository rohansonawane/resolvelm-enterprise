seed: 42
raw_dir: data/raw
processed_dir: data/processed
artifacts_dir: artifacts
docs_dir: docs
n_families: 24
n_variants_per_family: 2
preference_pairs_per_train: 2
split:
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  strategy: grouped_temporal
  group_key: family_id
  time_key: timestamp
leakage:
  exact_dedup: true
  near_dup_ngram: 8
  near_dup_jaccard: 0.92
  drop_train_test_overlap: true
max_log_events: 16
max_symptom_chars: 280
max_log_chars: 360
sources: [hadoop, hdfs, openstack]
label_origins:
  original: false
  derived: true
  deterministic_template: true
  synthetic_preference: true
