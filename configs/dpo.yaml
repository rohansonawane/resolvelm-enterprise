seed: 42
data:
  train_path: data/processed/dpo_train.jsonl
  val_path: data/processed/dpo_val.jsonl
output_dir: outputs/dpo
artifacts_dir: artifacts
mlflow_experiment: resolvelm
register_alias: champion
sft_adapter: outputs/sft/adapter

model:
  id: Qwen/Qwen2.5-0.5B-Instruct
  production_id: Qwen/Qwen3-4B-Instruct-2507

lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules: [q_proj, v_proj, k_proj, o_proj]
  qlora: false

train:
  epochs: 1
  learning_rate: 5.0e-5
  batch_size: 1
  grad_accum: 4
  max_seq_len: 768
  beta: 0.1
  warmup_ratio: 0.03
  max_grad_norm: 1.0
  optimizer: adamw_torch
  precision: bf16
  logging_steps: 1
  nan_abort: true
  resume: false
