[project]
name = "resolvelm"
version = "0.1.0"
description = "Enterprise LLM post-training, alignment, evaluation, and serving for AI-assisted incident resolution."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.12"
authors = [{ name = "Rohan Sonawane" }]
keywords = ["llm", "sft", "dpo", "incident-response", "mlops"]
dependencies = [
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "httpx>=0.27,<1",
  "pyyaml>=6.0,<7",
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "scikit-learn>=1.5,<2",
  "prometheus-client>=0.21,<1",
  "python-json-logger>=3.2,<4",
  "orjson>=3.10,<4",
  "jinja2>=3.1,<4",
  "joblib>=1.4,<2",
]

[project.optional-dependencies]
train = [
  "torch>=2.4,<2.8",
  "transformers>=4.46,<5",
  "datasets>=3.0,<4",
  "accelerate>=1.1,<2",
  "peft>=0.13,<1",
  "trl>=0.12,<0.16",
  "safetensors>=0.4,<1",
  "sentencepiece>=0.2,<1",
  "protobuf>=5,<8",
  "mlflow>=2.17,<3",
  "optuna>=4.0,<5",
]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
]
gpu = [
  "bitsandbytes>=0.43,<0.48",
]

[project.scripts]
resolvelm-api = "resolvelm.api.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resolvelm"]

[tool.hatch.build.targets.wheel.sources]
"src/resolvelm" = "resolvelm"

[tool.hatch.build.targets.sdist]
include = ["src/resolvelm", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
"scripts/**" = ["T201"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
  "slow: longer than smoke budget",
  "gpu: requires CUDA",
  "hf: requires downloaded Hugging Face weights",
]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
packages = ["resolvelm"]

[tool.uv]
package = true
