apiVersion: apps/v1
kind: Deployment
metadata:
  name: resolvelm-api
  namespace: resolvelm
spec:
  replicas: 2
  selector:
    matchLabels:
      app: resolvelm-api
  template:
    metadata:
      labels:
        app: resolvelm-api
    spec:
      containers:
        - name: api
          image: resolvelm-api:0.1.0
          ports:
            - containerPort: 8101
          envFrom:
            - configMapRef:
                name: resolvelm-config
            - secretRef:
                name: resolvelm-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          readinessProbe:
            httpGet:
              path: /ready
              port: 8101
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8101
            periodSeconds: 20
