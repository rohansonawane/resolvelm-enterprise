services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8101:8101"
    environment:
      RESOLVELM_BACKEND: rule
      RESOLVELM_API_PORT: "8101"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8101/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    ports:
      - "3101:3101"
    environment:
      NEXT_PUBLIC_API_BASE: http://127.0.0.1:8101
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3101"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.19.0
    command: ["mlflow", "server", "--host", "0.0.0.0", "--port", "5101", "--backend-store-uri", "sqlite:///mlflow.db", "--default-artifact-root", "/mlartifacts"]
    ports:
      - "5101:5101"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5101/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
